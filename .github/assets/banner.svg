<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F" />
      <stop offset="40%" stop-color="#120A24" />
      <stop offset="100%" stop-color="#07070B" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Abstract ambient glow orbs -->
  <circle cx="200" cy="100" r="180" fill="#7C3AED" opacity="0.18" filter="url(#neon)" />
  <circle cx="1000" cy="300" r="220" fill="#EC4899" opacity="0.12" filter="url(#neon)" />
  <circle cx="600" cy="200" r="140" fill="#4F46E5" opacity="0.15" filter="url(#neon)" />

  <!-- Grid decoration lines -->
  <line x1="0" y1="390" x2="1200" y2="390" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
  <line x1="0" y1="10" x2="1200" y2="10" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Center Content -->
  <g transform="translate(100, 110)">
    <!-- Brand Name -->
    <text x="0" y="70" font-family="'Inter', sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" letter-spacing="-2">
      Rating<tspan fill="url(#brandGrad)">X</tspan>
    </text>

    <!-- Star icon & Score badge -->
    <g transform="translate(410, 10)">
      <rect width="180" height="54" rx="27" fill="#181824" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.5" />
      <polygon points="28,27 34,13 40,27 54,29 44,38 47,52 34,44 21,52 24,38 14,29" fill="url(#goldGrad)" transform="translate(6, -6) scale(0.8)" />
      <text x="56" y="34" font-family="'Inter', sans-serif" font-weight="800" font-size="20" fill="#FDE047">10 / 10</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="130" font-family="'Inter', sans-serif" font-weight="600" font-size="22" fill="#E2E8F0" letter-spacing="-0.5">
      The Modern Desktop Catalog for Films, Series &amp; Anime
    </text>
    <text x="0" y="165" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#94A3B8">
      Custom Folders • Fine-Tuned Ratings • Official Trailers • Shareable HTML Profiles • Local-First
    </text>

    <!-- Category Pills -->
    <g transform="translate(0, 195)">
      <rect width="125" height="32" rx="16" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4" />
      <text x="62.5" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#A5B4FC" text-anchor="middle">🎬 MOVIES</text>

      <rect x="140" width="135" height="32" rx="16" fill="#2E1065" stroke="#9333EA" stroke-width="1" stroke-opacity="0.4" />
      <text x="207.5" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#D8B4FE" text-anchor="middle">📺 TV SHOWS</text>

      <rect x="290" width="125" height="32" rx="16" fill="#4A044E" stroke="#EC4899" stroke-width="1" stroke-opacity="0.4" />
      <text x="352.5" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#F472B6" text-anchor="middle">🌸 ANIME</text>
    </g>
  </g>
</svg>
